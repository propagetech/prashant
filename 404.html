<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#16130f">
  <script>
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem("properties-theme");
      } catch (err) {}
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="icon" href="/imgs/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <main class="hero">
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1>That page is not on this site</h1>
      <p class="lede">The map and listings live on the home page.</p>
      <p><a class="btn btn-primary" href="/">Properties for sale</a></p>
    </div>
  </main>
</body>
</html>
